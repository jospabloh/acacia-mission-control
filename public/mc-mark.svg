<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="ACACIA Mission Control">
  <defs>
    <linearGradient id="mcg" x1="6" y1="6" x2="58" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5b86ff"/>
      <stop offset="1" stop-color="#2b56d4"/>
    </linearGradient>
  </defs>
  <!-- console rim -->
  <circle cx="32" cy="32" r="21" fill="none" stroke="url(#mcg)" stroke-width="3"/>
  <!-- orbital path -->
  <ellipse cx="32" cy="32" rx="28" ry="10.5" fill="none" stroke="url(#mcg)" stroke-width="2.4"
           transform="rotate(-30 32 32)" opacity="0.85"/>
  <!-- telemetry ticks -->
  <g stroke="url(#mcg)" stroke-width="2.4" stroke-linecap="round" opacity="0.6">
    <line x1="32" y1="6.5" x2="32" y2="11"/>
    <line x1="57.5" y1="32" x2="53" y2="32"/>
    <line x1="32" y1="57.5" x2="32" y2="53"/>
    <line x1="6.5" y1="32" x2="11" y2="32"/>
  </g>
  <!-- core -->
  <circle cx="32" cy="32" r="6.4" fill="url(#mcg)"/>
  <circle cx="32" cy="32" r="2.6" fill="#fff" opacity="0.9"/>
  <!-- satellite on the orbit -->
  <circle cx="43.6" cy="16.4" r="3.4" fill="#5b86ff"/>
</svg>
